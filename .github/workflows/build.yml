name: Build Rezer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: python build.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $iss = (Get-Content installer.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ github.ref_name }}"'
          $iss | Set-Content installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rezer-windows
          path: dist/Rezer.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rezer-installer
          path: dist-installer/Rezer-Setup.exe

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rezer.exe
            dist-installer/Rezer-Setup.exe
          generate_release_notes: true
